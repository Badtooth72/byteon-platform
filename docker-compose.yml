x-build-args: &build-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,mongo,redis,auth}

services:
  # Coding Challenges App (formerly 'web')
  coding_challenges:
    build:
      context: ./coding_challenges
      args: *build-args
    container_name: coding_challenges
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/auth_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
      - BYTEON_SESSION_SECRET=${BYTEON_SESSION_SECRET}
      - HTTPS_PROXY
      - HTTP_PROXY
      - NO_PROXY
    depends_on:
      - mongo
    expose:
      - "5001"
    networks:
      - app-network
    labels:
      track_progress: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # MongoDB (shared database for all services)
  mongo:
    image: mongo:5
    container_name: mongo
    restart: always
    volumes:
      - ./mongo:/data/db
      - ./mongo_import:/data/import
    networks:
      - app-network

  # Authentication Service (LDAP + Mongo-backed profile)
  auth:
    build:
      context: ./auth
      args: *build-args
    container_name: auth_service
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/auth_db
      - LDAP_SERVER=${LDAP_SERVER}
      - LDAP_PORT=636
      - LDAP_BASE_DN=${LDAP_BASE_DN}
      - LDAP_BIND_DN=${LDAP_BIND_DN}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD}
      - ADMIN_USERNAMES=agriffiths
      - SQL_SERVER=${SQL_SERVER}
      - SQL_DATABASE=${SQL_DATABASE}
      - SQL_USERNAME=${SQL_USERNAME}
      - SQL_PASSWORD=${SQL_PASSWORD}
      - BYTEON_SESSION_SECRET=${BYTEON_SESSION_SECRET}
    depends_on:
      - mongo
      - redis
    expose:
      - "5002"
    networks:
      - app-network
    labels:
      track_progress: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Conversion Game App
  conversion_game:
    build:
      context: ./conversion_game
      args: *build-args
    container_name: conversion_game
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/auth_db
      - BYTEON_SESSION_SECRET=${BYTEON_SESSION_SECRET}
    depends_on:
      - mongo
    networks:
      - app-network
    expose:
      - "5003"
    
 
  #Logic Gate App
  logic_gate_quiz:
    build:
      context: ./logic_gate_quiz
      args: *build-args
    container_name: logic_gate_quiz
    restart: always
    expose:
      - "80"
    networks:
      - app-network

  #Flashcard App
  flashcard_generator:
    build:
      context: ./flashcard_generator
      args: *build-args
    container_name: flashcard_generator
    restart: always
    environment:
      - AUTH_API_BASE=http://auth:5002
      - MONGO_URI=mongodb://mongo:27017/auth_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BYTEON_SESSION_SECRET=${BYTEON_SESSION_SECRET}
      - URL_PREFIX=/flashcards
      - SUPER_ADMIN_USERNAMES=agriffiths
    depends_on:
      - mongo
      - redis
    expose:
      - "5005"
    networks:
      - app-network
    labels:
      track_progress: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  #Wordsearch App
  wordsearch_app:
    build:
      context: ./wordsearch_app
      args: *build-args
    container_name: wordsearch_app
    restart: always
    environment:
    - URL_PREFIX=/wordsearch_app
    expose:
      - "5006"
    networks:
      - app-network


  # Reports App
  reports:
    build:
      context: ./reports
      args: *build-args
    container_name: reports_service
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/auth_db
      - BYTEON_SESSION_SECRET=${BYTEON_SESSION_SECRET}
    depends_on:
      - mongo
    expose:
      - "5003"
    networks:
      - app-network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - coding_challenges
      - auth
      - conversion_game
    networks:
      - app-network

  # Certbot for Let's Encrypt SSL
  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: always
    environment:
      - HTTPS_PROXY
      - HTTP_PROXY
      - NO_PROXY
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "while :; do certbot renew; sleep 12h & wait $${!}; done;"
    networks:
      - app-network

  # Redis for session handling
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
