<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc"><title id="title">AND then NOT logic circuit</title><desc id="desc">Inputs A and B enter an AND gate; its output enters a NOT gate to produce Q equals NOT of A AND B.</desc><rect width="760" height="250" rx="20" fill="#102239"/><g font-family="Arial,sans-serif" fill="white"><text x="45" y="77" font-size="24">A</text><text x="45" y="160" font-size="24">B</text><text x="690" y="124" font-size="24">Q</text><text x="380" y="223" font-size="18" text-anchor="middle" fill="#c9e5f4">Q = ¬(A ∧ B) — work out the AND result first</text></g><g stroke="#55d2f4" stroke-width="5" fill="none"><path d="M76 70h155M76 154h155M363 112h101M562 112h116"/></g><path d="M230 47h51a65 65 0 0 1 0 130h-51z" fill="#173b5b" stroke="#a8ef63" stroke-width="4"/><text x="278" y="122" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="34">∧</text><path d="M465 64v96l88-48z" fill="#173b5b" stroke="#ffb85e" stroke-width="4"/><circle cx="560" cy="112" r="8" fill="#102239" stroke="#ffb85e" stroke-width="4"/><text x="509" y="120" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="30">¬</text></svg>
