<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc"><title id="title">Binary search halves the search space</title><desc id="desc">In a sorted list, searching for 11 checks middle value 7, discards the lower half, then checks 11.</desc><rect width="760" height="240" rx="20" fill="#102239"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="380" y="35" fill="white" font-size="21" font-weight="bold">Find 11 in a sorted list</text><g font-size="23" font-weight="bold" fill="white"><text x="91" y="104">1</text><text x="174" y="104">3</text><text x="257" y="104">5</text><text x="340" y="104">7</text><text x="423" y="104">9</text><text x="506" y="104">11</text><text x="589" y="104">13</text><text x="672" y="104">15</text></g><text x="340" y="158" fill="#ffb85e" font-size="17">① Check middle: 7</text><text x="506" y="198" fill="#a8ef63" font-size="17">② Search upper half: 11 found</text></g><g fill="none" stroke-width="3"><rect x="60" y="71" width="64" height="54" rx="8" stroke="#536a7c"/><rect x="143" y="71" width="64" height="54" rx="8" stroke="#536a7c"/><rect x="226" y="71" width="64" height="54" rx="8" stroke="#536a7c"/><rect x="309" y="71" width="64" height="54" rx="8" stroke="#ffb85e"/><rect x="392" y="71" width="64" height="54" rx="8" stroke="#a8ef63"/><rect x="475" y="71" width="64" height="54" rx="8" stroke="#a8ef63"/><rect x="558" y="71" width="64" height="54" rx="8" stroke="#a8ef63"/><rect x="641" y="71" width="64" height="54" rx="8" stroke="#a8ef63"/></g></svg>
