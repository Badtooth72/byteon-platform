<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">Fetch, decode, execute cycle</title><desc id="desc">An instruction moves from main memory to the control unit, then the CPU executes it and repeats the cycle.</desc>
  <rect width="760" height="230" rx="20" fill="#102239"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="25" y="53" width="200" height="112" rx="16" fill="#173b5b" stroke="#55d2f4" stroke-width="3"/><text x="125" y="99" fill="white" font-size="24" font-weight="bold">1 Fetch</text><text x="125" y="130" fill="#c9e5f4" font-size="16">from main memory</text><rect x="280" y="53" width="200" height="112" rx="16" fill="#173b5b" stroke="#a8ef63" stroke-width="3"/><text x="380" y="99" fill="white" font-size="24" font-weight="bold">2 Decode</text><text x="380" y="130" fill="#c9e5f4" font-size="16">control unit interprets</text><rect x="535" y="53" width="200" height="112" rx="16" fill="#173b5b" stroke="#ffb85e" stroke-width="3"/><text x="635" y="99" fill="white" font-size="24" font-weight="bold">3 Execute</text><text x="635" y="130" fill="#c9e5f4" font-size="16">perform the instruction</text><text x="380" y="207" fill="#c9e5f4" font-size="16">Then fetch the next instruction ↺</text></g><path d="M232 109h38m-12-10 12 10-12 10M487 109h38m-12-10 12 10-12 10" fill="none" stroke="#c9e5f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
