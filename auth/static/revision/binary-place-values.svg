<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="title desc">
  <title id="title">Eight-bit binary place values</title><desc id="desc">Binary 10110110 has place values 128, 32, 16, 4 and 2 selected, totalling 182.</desc>
  <rect width="760" height="210" rx="20" fill="#102239"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="380" y="36" fill="white" font-size="20" font-weight="bold">10110110₂ = 182₁₀</text><g fill="#c9e5f4" font-size="16"><text x="91" y="79">128</text><text x="174" y="79">64</text><text x="257" y="79">32</text><text x="340" y="79">16</text><text x="423" y="79">8</text><text x="506" y="79">4</text><text x="589" y="79">2</text><text x="672" y="79">1</text></g><g font-size="26" font-weight="bold" fill="white"><text x="91" y="124">1</text><text x="174" y="124">0</text><text x="257" y="124">1</text><text x="340" y="124">1</text><text x="423" y="124">0</text><text x="506" y="124">1</text><text x="589" y="124">1</text><text x="672" y="124">0</text></g><text x="380" y="181" fill="#a8ef63" font-size="18">128 + 32 + 16 + 4 + 2 = 182</text></g><g fill="none" stroke-width="2"><rect x="57" y="91" width="68" height="47" rx="8" stroke="#a8ef63"/><rect x="140" y="91" width="68" height="47" rx="8" stroke="#536a7c"/><rect x="223" y="91" width="68" height="47" rx="8" stroke="#a8ef63"/><rect x="306" y="91" width="68" height="47" rx="8" stroke="#a8ef63"/><rect x="389" y="91" width="68" height="47" rx="8" stroke="#536a7c"/><rect x="472" y="91" width="68" height="47" rx="8" stroke="#a8ef63"/><rect x="555" y="91" width="68" height="47" rx="8" stroke="#a8ef63"/><rect x="638" y="91" width="68" height="47" rx="8" stroke="#536a7c"/></g>
</svg>
