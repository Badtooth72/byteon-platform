<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Star network</title><desc id="desc">Three computers and a server connect separately to a central switch, which connects to a router.</desc><rect width="760" height="270" rx="20" fill="#102239"/><g stroke="#55d2f4" stroke-width="5"><path d="M380 130 125 70M380 130 125 205M380 130 620 70M380 130 620 205M380 130v-96"/></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="19" fill="white"><rect x="290" y="98" width="180" height="64" rx="14" fill="#176078"/><text x="380" y="138">Switch</text><g fill="#173b5b" stroke="#a8ef63" stroke-width="2"><rect x="45" y="42" width="160" height="56" rx="12"/><rect x="45" y="177" width="160" height="56" rx="12"/><rect x="540" y="42" width="160" height="56" rx="12"/><rect x="540" y="177" width="160" height="56" rx="12"/><rect x="300" y="12" width="160" height="56" rx="12"/></g><text x="125" y="78">Computer</text><text x="125" y="213">Computer</text><text x="620" y="78">Computer</text><text x="620" y="213">Server</text><text x="380" y="49">Router</text><text x="380" y="245" fill="#c9e5f4" font-size="16">Each device has its own link to the central switch</text></g>
</svg>
