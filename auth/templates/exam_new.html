<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create question | Byteon</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/portal.css"><link rel="stylesheet" href="/static/theme-bridge.css"><link rel="stylesheet" href="/static/exam-delivery.css"></head><body><header class="topbar"><a class="brand" href="/dashboard">BYTEON</a><div class="theme-controls top-actions" data-theme-controls><a class="button" href="/exam-bank">Question bank</a></div></header><main class="page"><h1>Create a question</h1><p>Add a teacher-authored question, then choose its printed and online response format.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" class="format-form format-panel"><input name="form_token" type="hidden" value="{{ form_token }}"><label>Title<input name="title" maxlength="200" required value="{{ request.form.get('title','') }}"></label><label>Paper<select name="component">{% for component in ['J277/01','J277/02'] %}<option {% if request.form.get('component')==component %}selected{% endif %}>{{ component }}</option>{% endfor %}</select></label><label>Topic<select name="topic">{% for topic in topics %}<option value="{{ topic.code }}" {% if request.form.get('topic')==topic.code %}selected{% endif %}>{{ topic.code }} · {{ topic.name }}</option>{% endfor %}</select></label><label>Marks<input name="marks" type="number" min="1" max="40" value="{{ request.form.get('marks','1') }}" required></label><label>Question text<textarea name="question_text" rows="8" maxlength="8000" required>{{ request.form.get('question_text','') }}</textarea></label><button class="button primary">Create and choose response type</button></form></main><script src="/static/editor-session.js"></script></body></html>
