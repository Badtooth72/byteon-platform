<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} | Byteon</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/portal.css"><link rel="stylesheet" href="/static/theme-bridge.css"></head><body>
<header class="topbar"><a class="brand" href="/dashboard">BYTEON</a><div class="top-actions theme-controls" data-theme-controls><button class="icon-button" data-theme-toggle></button><a class="button" href="/dashboard">Dashboard</a></div></header>
<main class="page"><section class="hero"><div><p class="eyebrow">BYTEON LEADERBOARDS</p><h1>{{ title }}</h1><p>Scores use the same percentage model across activities. Raw points and attempts show how much work sits behind each result.</p></div></section>
<div class="filters"><input id="search" placeholder="Search users"><select id="activity"><option value="">All activities</option></select><select id="class"><option value="">All classes</option></select></div>
<div class="table-panel"><table><thead><tr><th>#</th><th>Learner</th><th>Activity</th><th>Score</th><th>Points</th><th>Attempts</th><th>Detail</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading scores…</td></tr></tbody></table></div></main>
<script>
const activityKey={{ activity_key|tojson }},endpoint=activityKey==='all'?'/api/leaderboards?limit=500':`/api/leaderboards/${activityKey}?limit=200`;let all=[],me='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function options(id,key,label){const el=document.getElementById(id),values=[...new Set(all.map(x=>x[key]).filter(Boolean))].sort();el.innerHTML=`<option value="">All ${label}</option>`+values.map(v=>`<option>${esc(v)}</option>`).join('')}
function render(){const search=document.getElementById('search').value.toLowerCase(),activity=document.getElementById('activity').value,klass=document.getElementById('class').value;const rows=all.filter(r=>(!search||r.full_name.toLowerCase().includes(search))&&(!activity||r.activity_name===activity)&&(!klass||r.class_name===klass));document.getElementById('rows').innerHTML=rows.length?rows.map((r,i)=>`<tr class="${r.username===me?'current':''}"><td>${i+1}</td><td>${r.username===me?`<a href="/user/${encodeURIComponent(r.username)}">${esc(r.full_name)}</a>`:esc(r.full_name)}${r.role!=='student'?` <span class="pill">${esc(r.role)}</span>`:''}</td><td>${esc(r.activity_name)}</td><td><strong>${r.score}%</strong></td><td>${r.points}/${r.max_points}</td><td>${r.attempts}</td><td class="muted">${esc(r.sub_activity)}</td></tr>`).join(''):'<tr><td colspan="7">No recorded scores match these filters.</td></tr>'}
Promise.all([fetch(endpoint).then(r=>{if(!r.ok)throw Error('Unable to load scores');return r.json()}),fetch('/api/session-user').then(r=>r.json())]).then(([rows,user])=>{all=rows;me=user.username;options('activity','activity_name','activities');options('class','class_name','classes');['search','activity','class'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));render()}).catch(e=>document.getElementById('rows').innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`);
</script></body></html>
