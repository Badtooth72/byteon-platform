{% macro quick(prompt, options, answer, why) %}<div class="quick-check" data-answer="{{ answer }}" data-why="{{ why }}"><fieldset><legend>{{ prompt }}</legend>{% for option in options %}<label><input type="radio" name="choice" value="{{ option }}" required><span>{{ option }}</span></label>{% endfor %}</fieldset><button class="button" type="button">Check answer</button><p class="check-feedback" role="status" aria-live="polite"></p></div>{% endmacro %}
{% macro recall(prompt, answer, why) %}<div class="quick-check" data-answer="{{ answer }}" data-why="{{ why }}"><label class="recall-label">{{ prompt }}<input type="text" name="answer" autocomplete="off" aria-label="Your answer" maxlength="100"></label><button class="button" type="button">Check answer</button><p class="check-feedback" role="status" aria-live="polite"></p></div>{% endmacro %}
