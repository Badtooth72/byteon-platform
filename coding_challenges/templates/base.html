<!-- base.html -->
<!--
  Base template that defines the overall structure.
  It loads Bootstrap, our custom CSS, and provides blocks for content and additional scripts.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Python GCSE Programming Challenges{% endblock %}</title>
  <script src="/static/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/coding-challenges/static/styles.css">
  <link rel="stylesheet" href="/static/theme-bridge.css">
  {% block head %}{% endblock %}
</head>
<body>
  <style>.challenge{display:none}.challenge.active{display:block}</style>
  <nav class="byteon-bar"><a href="/dashboard" class="byteon-brand">BYTEON</a><span>Python Challenges</span><div class="theme-controls" data-theme-controls></div></nav>
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
