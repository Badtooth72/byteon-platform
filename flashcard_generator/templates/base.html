<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ByteOn Flashcards{% endblock %}</title>

  <script src="/static/theme.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='flashcards.css') }}" rel="stylesheet">
  <link href="/static/theme-bridge.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="flashcards-body">
  <nav class="navbar navbar-expand-lg border-bottom sticky-top flashcards-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🗂 ByteOn Flashcards</a>
      <div class="d-flex gap-2 align-items-center">
        <a class="btn btn-outline-info btn-sm" href="{{ url_for('play_library') }}">Play</a>
        <a class="btn btn-outline-success btn-sm" href="{{ url_for('make_library') }}">Make</a>
        <span class="badge text-bg-dark border border-secondary">User: {{ current_user|default('guest', true) }}</span>
        <div class="theme-controls" data-theme-controls></div>
        <a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4 py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
